<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>microGPT anatomy — explorable stack</title>
<meta name="description" content="Turn the seven-plate stack of a tiny GPT turned into hardware. Pick a plate to see its real files, numbers, and the agents that made it.">
<link rel="stylesheet" href="./art/tokens.css">
<link rel="stylesheet" href="./explore.css">
<script type="importmap">
{
 "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/": "./vendor/three/addons/"
 }
}
</script>
</head>
<body>
<canvas id="stage" tabindex="0" role="img" aria-label="Exploded stack of seven plates, Service on top and Cells at the bottom, with a red thread through all of them. Drag or use the left and right arrow keys to turn it."></canvas>
<svg id="leaders" aria-hidden="true"></svg>
<div id="labels" aria-hidden="true"></div>
<div class="callout thread" id="thread-callout" aria-hidden="true"></div>

<header class="head">
  <p class="kicker">Interactive model</p>
  <h1 id="headline">Pick a plate: its files, its numbers, the agents that made it</h1>
</header>

<main id="panel">
  <div class="plates" id="plates" role="radiogroup" aria-label="Plates"></div>
  <section class="card" id="card" aria-live="polite">
    <div class="title"><span class="chip" id="t-chip"></span><h2 id="t-name"></h2></div>
    <p class="note" id="t-note"></p>
    <div class="tabs" role="tablist" aria-label="Plate details" id="tabs">
      <button role="tab" id="tab-nums" aria-controls="pane-nums" aria-selected="true">Numbers</button>
      <button role="tab" id="tab-files" aria-controls="pane-files" aria-selected="false" tabindex="-1">Files</button>
      <button role="tab" id="tab-by" aria-controls="pane-by" aria-selected="false" tabindex="-1">Made by</button>
    </div>
    <div role="tabpanel" id="pane-nums" aria-labelledby="tab-nums" class="pane"></div>
    <div role="tabpanel" id="pane-files" aria-labelledby="tab-files" class="pane" hidden></div>
    <div role="tabpanel" id="pane-by" aria-labelledby="tab-by" class="pane" hidden></div>
  </section>
  <div class="ctrl">
    <label class="slider"><span id="explode-label">Explode</span><input id="explode" type="range" min="0" max="100" step="1" value="25"></label>
    <button id="reset" class="link">Reset view</button>
  </div>
  <p class="hint" id="hint">Drag to turn · ↑ ↓ pick a plate · ← → turn</p>
</main>

<script type="module" src="./explore.js"></script>
</body>
</html>
